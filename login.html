<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — DANISH ZAMURD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-page">

    <div class="auth-card">
      <p class="auth-brand">Danish Zamurd</p>
      <p class="auth-intro">Welcome to the Danish Zamurd Portfolio. Please log in or create an account to explore my work, skills, projects, and services.</p>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to your account.</p>

      <p class="auth-error" id="authError"></p>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required>
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>

      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="page-transition.js"></script>
  <script src="auth.js"></script>
</body>

</html>
